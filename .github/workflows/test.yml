name: CI

on:
  # A PR's commits are tested by pull_request; a push to a PR's branch would
  # test the same code again.  On push, only main.  What gets merged into
  # staging (which can differ from what its PR tested, when staging moved on)
  # is tested by the daily scheduled run below, not at each merge.
  push:
    branches: [main]
    paths-ignore:
      - '.claude/**'
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: ["*"]
    # Changes only to the Claude Code skills or to documents need no test run.
    paths-ignore:
      - '.claude/**'
      - '**.md'
      - 'docs/**'
  # Once a day on the default branch (staging on the cxxxr/lem fork),
  # skipped when that commit already passed.
  schedule:
    - cron: '30 19 * * *'   # 19:30 UTC, 04:30 JST
  workflow_dispatch:

env:
  IMAGE_NAME: lem
  IMAGE_TAGS: latest ${{ github.sha }}
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ github.token }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      actions: read     # to find the last scheduled run
      contents: read

    steps:
      # A scheduled run tests nothing when the last successful scheduled run
      # was for the same commit.
      - name: Skip a commit that already passed
        id: skip
        if: github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'test.yml',
              event: 'schedule',
              status: 'success',
              per_page: 1,
            });
            const last = data.workflow_runs[0];
            const skip = Boolean(last && last.head_sha === context.sha);
            if (skip) console.log(`${context.sha} already passed in run ${last.html_url}: skipping.`);
            core.setOutput('skip', String(skip));

      - uses: actions/checkout@v7
        if: steps.skip.outputs.skip != 'true'

      - name: Lint - Check for internal symbol usage
        if: steps.skip.outputs.skip != 'true'
        run: |
          # Not .claude/: the Lisp there is Claude Code's tooling, not Lem,
          # and a PR changing only .claude/ does not run this workflow.
          if [ $(grep -r --include="*.lisp" --exclude-dir=.claude 'lem::' | wc -l) -ne 0 ]; then
            echo 'using `lem::` internal symbols'
            echo 'https://google.github.io/styleguide/lispguide.xml?showone=Packages#Packages'
            exit 1
          fi

      - name: Build test image
        if: steps.skip.outputs.skip != 'true'
        run: docker build -f docker/Dockerfile.test -t lem-tests .

      - name: Run tests
        if: steps.skip.outputs.skip != 'true'
        run: docker run --rm lem-tests

  push_image:
    name: Push Image to GHCR
    runs-on: ubuntu-latest
    # Not for the daily scheduled run: on a repository whose default branch
    # is main, it would push an image every day.
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
      # Build image using Buildah action
      - name: Build Image
        uses: redhat-actions/buildah-build@v3
        id: build_image
        with:
          containerfiles: ./Dockerfile
          image: ${{ env.IMAGE_NAME }}
          oci: true

      # Push the image to GHCR (Image Registry)
      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@v3
        id: push
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          extra-args: --disable-content-trust
