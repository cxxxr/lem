name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    # "**" so pull requests into branches with a slash (stacked PRs such as
    # sdl3/foo) are tested too; "*" does not match "/".
    branches: ["**"]
  workflow_dispatch:

env:
  IMAGE_NAME: lem
  IMAGE_TAGS: latest ${{ github.sha }}
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ github.token }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Lint - Check for internal symbol usage
        run: |
          if [ $(grep -r --include="*.lisp" 'lem::' | wc -l) -ne 0 ]; then
            echo 'using `lem::` internal symbols'
            echo 'https://google.github.io/styleguide/lispguide.xml?showone=Packages#Packages'
            exit 1
          fi

      - name: Build test image
        run: docker build -f docker/Dockerfile.test -t lem-tests .

      - name: Run tests
        run: docker run --rm lem-tests

  sdl3-test:
    # The test image has no SDL3, and Ubuntu 24.04 has no SDL3 packages, so
    # the SDL3 frontend is tested on macOS with Homebrew's libraries.  The
    # tests draw with SDL's software renderer and open no window.
    name: SDL3 frontend tests (macOS)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL, qlot, SDL3 and the text shaping libraries
        run: |
          brew install sbcl sdl3 sdl3_ttf sdl3_image freetype harfbuzz openssl@3
          # cl+ssl (used by qlot) needs OpenSSL 3; see nightly-builds.yml.
          ln -sfn "$(brew --prefix openssl@3)" "$(brew --prefix)/opt/openssl"
          curl -L https://qlot.tech/installer | sh
          echo "$HOME/.qlot/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: qlot install

      - name: Run SDL3 frontend tests
        run: |
          CL_SOURCE_REGISTRY="(:source-registry (:tree \"$PWD/\") :ignore-inherited-configuration)" \
            .qlot/bin/rove frontends/sdl3/lem-sdl3.asd

  push_image:
    name: Push Image to GHCR
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3
      # Build image using Buildah action
      - name: Build Image
        uses: redhat-actions/buildah-build@v2
        id: build_image
        with:
          containerfiles: ./Dockerfile
          image: ${{ env.IMAGE_NAME }}
          oci: true

      # Push the image to GHCR (Image Registry)
      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@v2
        id: push
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          extra-args: --disable-content-trust
