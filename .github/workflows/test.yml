name: CI

on:
  # A PR's commits are tested by pull_request; a push to a PR's branch would
  # test the same code again.  On push, only main.  What gets merged into
  # staging (which can differ from what its PR tested, when staging moved on)
  # is tested by the daily scheduled run below, not at each merge.
  push:
    branches: [main]
    # The same list as for pull_request below.
    paths-ignore:
      - '.claude/**'
      - '**.md'
      - 'docs/**'
  pull_request:
    # "**" so pull requests into branches with a slash (release/2.0, stacked
    # PRs such as sdl3/foo) are tested too; "*" does not match "/".
    branches: ["**"]
    # Changes only to the Claude Code skills or to documents need no test run.
    # ship wait (.claude/skills/ship/ship) reads this list to pass a PR that
    # no workflow runs for: keep it a list of globs without "!".
    paths-ignore:
      - '.claude/**'
      - '**.md'
      - 'docs/**'
  # Once a day on the default branch (staging on the cxxxr/lem fork),
  # skipped when that commit's tests already passed in a push, manual or
  # earlier scheduled run (one that tested rather than skipped).
  schedule:
    - cron: '30 19 * * *'   # 19:30 UTC, 04:30 JST
  workflow_dispatch:

env:
  IMAGE_NAME: lem
  IMAGE_TAGS: latest ${{ github.sha }}
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ github.token }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      actions: read     # to find the runs for this commit
      contents: read

    steps:
      # A scheduled run tests nothing when the tests of the same commit
      # already passed in a run of this workflow: a push (to main upstream),
      # a manual run, or an earlier scheduled run.  Not a pull_request run:
      # it tested the merge of the PR into its base, not this commit.  The
      # job and step names "test" and "Run tests" are read by this step.
      - name: Skip a commit that already passed
        id: skip
        if: github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            // passed is null when the lookup did not finish (an API error, or
            // maxLookups reached): then test.  An API error must not fail the job,
            // which would test nothing.
            let passed;
            try {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'test.yml',
                head_sha: context.sha,
                per_page: 100,
              });
              // Not the API's status filter: it can miss a run that finished
              // minutes ago.  A run still testing does not count (it can still
              // fail), so the commit of a push just before the schedule is
              // tested twice.
              // A run counts only if it tested: its "Run tests" step
              // succeeded.  Not the run's conclusion: a scheduled run that
              // skipped ends as a success too (and once the run it skipped on
              // failed in a re-run, every later scheduled run would skip on
              // it), and a push to main whose push_image failed ends as a
              // failure though its tests passed.
              // The runs that succeeded first (not those whose tests failed),
              // and of those the ones that took longest: one that skipped
              // takes seconds, one that tested takes minutes, so the jobs of
              // few runs are looked up however many skipped; and at most
              // maxLookups: past that, test.  (A push whose push_image failed
              // comes after the scheduled runs that skipped on it, so its
              // commit is tested once more after maxLookups of them; then not
              // again, as that scheduled run comes first.)
              const maxLookups = 10;
              let lookups = 0;
              const tested = async (run) => {
                lookups += 1;
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  filter: 'latest',
                  per_page: 100,
                });
                return jobs.some((job) => job.name === 'test' &&
                  (job.steps || []).some((step) => step.name === 'Run tests' && step.conclusion === 'success'));
              };
              // 0 for a run not started yet (no run_started_at), not NaN, which breaks the sort.
              const duration = (run) => (Date.parse(run.updated_at) - Date.parse(run.run_started_at)) || 0;
              const candidates = runs
                .filter((run) => run.event !== 'pull_request' && run.id !== context.runId)
                .sort((x, y) => (y.conclusion === 'success') - (x.conclusion === 'success') ||
                  duration(y) - duration(x));
              for (const run of candidates) {
                if (lookups >= maxLookups) {
                  console.log(`Looked up the jobs of ${lookups} runs of ${context.sha} with no passed tests, testing.`);
                  passed = null;
                  break;
                }
                if (await tested(run)) { passed = run; break; }
              }
            } catch (error) {
              core.warning(`Could not look up the runs of ${context.sha}, testing: ${error.message}`);
              passed = null;
            }
            if (passed) console.log(`The tests of ${context.sha} already passed in run ${passed.html_url} (${passed.event}): skipping.`);
            else if (passed === undefined) console.log(`${context.sha} has no successful push, manual or scheduled test run yet: testing.`);
            core.setOutput('skip', String(Boolean(passed)));

      - uses: actions/checkout@v7
        if: steps.skip.outputs.skip != 'true'

      - name: Lint - Check for internal symbol usage
        if: steps.skip.outputs.skip != 'true'
        run: |
          # Not .claude/: the Lisp there is Claude Code's tooling, not Lem,
          # and a PR changing only .claude/ does not run this workflow.
          if [ $(grep -r --include="*.lisp" --exclude-dir=.claude 'lem::' | wc -l) -ne 0 ]; then
            echo 'using `lem::` internal symbols'
            echo 'https://google.github.io/styleguide/lispguide.xml?showone=Packages#Packages'
            exit 1
          fi

      - name: Build test image
        if: steps.skip.outputs.skip != 'true'
        run: docker build -f docker/Dockerfile.test -t lem-tests .

      - name: Run tests
        if: steps.skip.outputs.skip != 'true'
        run: docker run --rm lem-tests

  push_image:
    name: Push Image to GHCR
    # No image of a commit whose tests failed.
    needs: test
    runs-on: ubuntu-latest
    # Not for the daily scheduled run: on a repository whose default branch
    # is main, it would push an image every day.
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
      # Build image using Buildah action
      - name: Build Image
        uses: redhat-actions/buildah-build@v3
        id: build_image
        with:
          containerfiles: ./Dockerfile
          image: ${{ env.IMAGE_NAME }}
          oci: true

      # Push the image to GHCR (Image Registry)
      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@v3
        id: push
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          extra-args: --disable-content-trust
