name: Nix CI

on:
  push:
    branches:
      - main
    # The same list as for pull_request below.
    paths-ignore:
      - '.claude/**'
      - '**.md'
      - 'docs/**'
  pull_request:
    # Changes only to the Claude Code skills or to documents need no build.
    # ship wait (.claude/skills/ship/ship) reads this list to pass a PR that
    # no workflow runs for: keep it a list of globs without "!", or ship
    # cannot read it and a PR changing only these files waits until it
    # times out.
    paths-ignore:
      - '.claude/**'
      - '**.md'
      - 'docs/**'
  # Every default target (not SDL2), macOS included, once a day on the
  # default branch (staging on the cxxxr/lem fork), skipped when that commit
  # already passed on every OS (in a push or manual run, or a scheduled run
  # that built rather than skipped).
  schedule:
    - cron: '0 19 * * *'   # 19:00 UTC, 04:00 JST
  # Trigger manually to optionally include heavier/unstable targets
  workflow_dispatch:
    inputs:
      include_optional:
        description: 'Include optional targets (SDL2)'
        type: boolean
        default: false

jobs:
  # 1. Job to generate the matrix dynamically based on inputs
  setup:
    runs-on: ubuntu-latest
    permissions:
      actions: read     # to find the runs for this commit
      contents: read
    outputs:
      os: ${{ steps.set-matrix.outputs.os }}
      backend: ${{ steps.set-matrix.outputs.backend }}
      skip: ${{ steps.set-matrix.outputs.skip }}
    steps:
      - name: Generate Matrix JSON
        id: set-matrix
        uses: actions/github-script@v9
        with:
          script: |
            // Default configuration (Stable & Lightweight targets)
            let osList = ["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15"];

            // macOS runners are often queued for a long time: pull requests
            // build on Linux only; macOS is built by the daily scheduled run,
            // on a push to main, and when triggered by hand.
            if (context.eventName === 'pull_request') {
              osList = osList.filter((os) => !os.startsWith("macos"));
            }

            // A scheduled run builds nothing when a run of this workflow
            // already passed on every OS for the same commit: a push (to
            // main upstream), a manual run, or an earlier scheduled run.
            // Not a pull_request run: it built no macOS, and it built the
            // merge of the PR into its base, not this commit.  The build
            // job's name ("builds ...") is read below.
            let skip = false;
            if (context.eventName === 'schedule') {
              // passed is null when the lookup did not finish (an API error, or
              // maxLookups reached): then build.  An API error must not fail the job,
              // which would build nothing.
              let passed;
              try {
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'ci.yml',
                  head_sha: context.sha,
                  per_page: 100,
                });
                // Not the status: 'success' filter of the API: it can miss a run
                // that finished minutes ago.  A run still in progress does not
                // count (it can still fail), so the commit of a push just before
                // the schedule is built twice.
                // A scheduled run that skipped ends as a success too: it counts
                // only if it built (its build jobs, which run only then,
                // succeeded).  Else, once the run it skipped on failed in a
                // re-run, every later scheduled run would skip on it.
                // The scheduled runs that took longest first: one that skipped
                // takes seconds, one that built takes minutes, so the jobs of
                // few runs are looked up however many skipped; and at most
                // maxLookups: past that, build.
                const maxLookups = 10;
                let lookups = 0;
                const built = async (run) => {
                  if (run.conclusion !== 'success' || run.event === 'pull_request') return false;
                  if (run.event !== 'schedule') return true;
                  lookups += 1;
                  const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                    filter: 'latest',
                    per_page: 100,
                  });
                  return jobs.some((job) => job.name.startsWith('builds ') && job.conclusion === 'success');
                };
                // 0 for a run not started yet (no run_started_at), not NaN, which breaks the sort.
                const duration = (run) => (Date.parse(run.updated_at) - Date.parse(run.run_started_at)) || 0;
                // Those that need no lookup (push and manual runs) first.
                runs.sort((x, y) => (x.event === 'schedule') - (y.event === 'schedule') ||
                  duration(y) - duration(x));
                for (const run of runs) {
                  if (lookups >= maxLookups && run.event === 'schedule' && run.conclusion === 'success') {
                    console.log(`Looked up the jobs of ${lookups} scheduled runs of ${context.sha} with no build, building.`);
                    passed = null;
                    break;
                  }
                  if (await built(run)) { passed = run; break; }
                }
              } catch (error) {
                core.warning(`Could not look up the runs of ${context.sha}, building: ${error.message}`);
                passed = null;
              }
              if (passed) {
                console.log(`${context.sha} already passed in run ${passed.html_url} (${passed.event}): skipping.`);
                skip = true;
              } else if (passed === undefined) {
                console.log(`${context.sha} has no successful push, manual or scheduled build on every OS yet: building.`);
              }
            }
            core.setOutput('skip', String(skip));
            let backendList = ["lem-ncurses", "lem-webview"];

            // Check if optional targets should be included
            // (Only strictly when triggered via workflow_dispatch with the flag set to true)
            if (context.payload.inputs && context.payload.inputs.include_optional === 'true') {
              console.log("Adding optional targets (SDL2)...");
              backendList.push("lem-sdl2");
            }

            // Set outputs for the next job to consume
            core.setOutput('os', JSON.stringify(osList));
            core.setOutput('backend', JSON.stringify(backendList));

  # 2. Build job using the dynamically generated matrix
  build:
    needs: setup
    if: needs.setup.outputs.skip != 'true'
    name: builds ${{ matrix.backend }} on ${{ matrix.os }}
    # The 'runs-on' key also uses the dynamic matrix
    runs-on: ${{ matrix.os }}
    # FlakeHub Cache authenticates via GitHub OIDC, which needs id-token: write.
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Parse JSON strings from the setup job outputs
        os: ${{ fromJson(needs.setup.outputs.os) }}
        backend: ${{ fromJson(needs.setup.outputs.backend) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      # magic-nix-cache-action was sunset 2025-02-01 and now rate-limits /
      # 418s, causing intermittent "no substituter" failures. FlakeHub Cache
      # is its supported successor (auth via the OIDC token above).
      - name: Setup FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@main

      - name: Check flake
        run: nix flake check --all-systems --no-build

      - name: Build ${{ matrix.backend }}
        run: nix build .#${{ matrix.backend }} --print-build-logs
